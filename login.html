<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SCED</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />

    <style>
      body {
        background-color: #f0f0f0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        width: 100%;
        max-width: 400px;
      }
      .login-header {
        background-color: #0d6efd;
        color: white;
        padding: 30px;
        text-align: center;
      }
      .btn-login {
        padding: 12px;
        font-weight: bold;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="login-card bg-white">
      <div class="login-header">
        <i class="bi bi-file-earmark-lock-fill" style="font-size: 3rem"></i>
        <h4 class="mt-2 mb-0">SCED</h4>
        <p class="small mb-0 opacity-75">Controle de Entrada de Documentos</p>
      </div>

      <div class="card-body p-4">
        <div
          id="loginAlert"
          class="alert alert-danger d-none"
          role="alert"
        ></div>
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label fw-bold small text-muted"
              >E-mail Institucional</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="bi bi-envelope text-muted"></i
              ></span>
              <input
                type="email"
                class="form-control border-start-0 ps-0"
                id="email"
                placeholder="nome@exemplo.com"
                required
              />
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-bold small text-muted"
              >Senha</label
            >
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"
                ><i class="bi bi-key text-muted"></i
              ></span>
              <input
                type="password"
                class="form-control border-start-0 ps-0"
                id="password"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <div class="d-grid gap-2">
            <button
              id="loginButton"
              type="submit"
              class="btn btn-primary btn-login"
            >
              Acessar Sistema
            </button>
          </div>

          <div class="text-center mt-3">
            <a href="#" class="text-decoration-none small">Esqueceu a senha?</a>
          </div>
        </form>
      </div>

      <div class="card-footer bg-light border-0 py-3 text-center">
        <small class="text-muted">Fábrica de Software - 2026</small>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
