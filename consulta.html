<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Documentos - SCED</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav id="sidebar">
      <div class="sidebar-header">
        <h4 class="mb-0">SCED</h4>
        <small>Gestão de Documentos</small>
      </div>

      <div class="p-3">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a href="index.html" class="nav-link">
              <i class="bi bi-speedometer2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a href="registro.html" class="nav-link">
              <i class="bi bi-file-earmark-plus"></i> Registrar Entrada
            </a>
          </li>
          <li class="nav-item">
            <a href="consulta.html" class="nav-link active">
              <i class="bi bi-search"></i> Consultar
            </a>
          </li>
          <li class="nav-item">
            <a href="relatorios.html" class="nav-link">
              <i class="bi bi-graph-up"></i> Relatórios
            </a>
          </li>
          <li class="nav-item">
            <a href="usuarios.html" class="nav-link">
              <i class="bi bi-people"></i> Usuários
            </a>
          </li>
        </ul>
      </div>

      <div class="mt-auto p-3">
        <hr class="text-secondary" />
        <a href="login.html" class="nav-link text-danger" id="logoutLink">
          <i class="bi bi-box-arrow-left"></i> Sair
        </a>
      </div>
    </nav>

    <main id="content" class="bg-light">
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="top-title">Consulta e Rastreamento</h2>
          <div class="operator-card" aria-label="Informacoes do operador">
            <i class="bi bi-person-circle operator-icon" aria-hidden="true"></i>
            <h3 class="operator-name" id="operatorName">Operador</h3>
            <span class="operator-badge" id="operatorPerfil">Perfil</span>
          </div>
        </div>
        <hr class="operator-divider" />
      </div>

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <form class="row g-3" id="consultaFiltroForm">
            <div class="col-md-3">
              <label class="form-label small fw-bold">Nº Protocolo</label>
              <input
                type="text"
                class="form-control"
                id="consultaFiltroProtocolo"
                placeholder="Ex: 2026.0001"
              />
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Remetente</label>
              <input
                type="text"
                class="form-control"
                id="consultaFiltroRemetente"
                placeholder="Nome da origem"
              />
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Status</label>
              <select class="form-select" id="consultaFiltroStatus">
                <option selected value="">Todos os Status</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-search me-2"></i>Pesquisar
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4">Protocolo</th>
                  <th>Data Entrada</th>
                  <th>Remetente</th>
                  <th>Tipo</th>
                  <th>Status</th>
                  <th class="text-center">Ações</th>
                </tr>
              </thead>
              <tbody id="consultaDocumentosBody">
                <tr>
                  <td colspan="6" class="text-center py-4 text-muted">
                    Carregando documentos...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <div
      class="modal fade"
      id="modalHistoricoDocumentoConsulta"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="historicoModalTitleConsulta">
              Historico do Documento
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body">
            <div id="historicoDocumentoBodyConsulta" class="text-muted">
              Carregando historico...
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="modalAlterarStatusConsulta"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="alterarStatusFormConsulta">
            <div class="modal-header">
              <h5
                class="modal-title fw-bold"
                id="alterarStatusModalTitleConsulta"
              >
                Alterar Status
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="alterarStatusDocumentoIdConsulta" />
              <div class="mb-3">
                <label for="alterarStatusSelectConsulta" class="form-label"
                  >Novo status</label
                >
                <select
                  id="alterarStatusSelectConsulta"
                  class="form-select"
                  required
                >
                  <option value="" selected disabled>Selecione o status</option>
                </select>
              </div>
              <div>
                <label for="alterarStatusObservacaoConsulta" class="form-label"
                  >Observacao (opcional)</label
                >
                <textarea
                  id="alterarStatusObservacaoConsulta"
                  class="form-control"
                  rows="3"
                  maxlength="255"
                  placeholder="Detalhe da movimentacao"
                ></textarea>
              </div>
              <div
                id="alterarStatusErroConsulta"
                class="text-danger small mt-2 d-none"
              ></div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="alterarStatusSalvarBtnConsulta"
              >
                Salvar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/index.js"></script>
    <script src="assets/js/consulta.js"></script>
  </body>
</html>
