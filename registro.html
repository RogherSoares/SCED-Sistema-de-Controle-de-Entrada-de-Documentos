<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Entrada - SCED</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <nav id="sidebar">
      <div class="sidebar-header">
        <h4 class="mb-0">SCED</h4>
        <small>Gestão de Documentos</small>
      </div>

      <div class="p-3">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a href="index.html" class="nav-link">
              <i class="bi bi-speedometer2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a href="registro.html" class="nav-link active">
              <i class="bi bi-file-earmark-plus"></i> Registrar Entrada
            </a>
          </li>
          <li class="nav-item">
            <a href="consulta.html" class="nav-link">
              <i class="bi bi-search"></i> Consultar
            </a>
          </li>
          <li class="nav-item">
            <a href="relatorios.html" class="nav-link">
              <i class="bi bi-graph-up"></i> Relatórios
            </a>
          </li>
          <li class="nav-item">
            <a href="usuarios.html" class="nav-link">
              <i class="bi bi-people"></i> Usuários
            </a>
          </li>
        </ul>
      </div>

      <div class="mt-auto p-3">
        <hr class="text-secondary" />
        <a href="login.html" class="nav-link text-danger" id="logoutLink">
          <i class="bi bi-box-arrow-left"></i> Sair
        </a>
      </div>
    </nav>

    <main id="content">
      <div class="registro-shell">
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <h2 class="top-title">Entrada de Documento</h2>
            <div class="operator-card" aria-label="Informacoes do operador">
              <i
                class="bi bi-person-circle operator-icon"
                aria-hidden="true"
              ></i>
              <h3 class="operator-name" id="operatorName">Operador</h3>
              <span class="operator-badge" id="operatorPerfil">Perfil</span>
            </div>
          </div>
          <hr class="operator-divider" />
        </div>

        <div class="card registro-card">
          <div class="card-body">
            <form action="#" method="POST" class="row g-4">
              <div class="col-lg-4 col-md-6">
                <label class="form-label">Número de Protocolo</label>
                <input
                  type="text"
                  class="form-control protocolo-input"
                  value="AUTOMÁTICO"
                  readonly
                />
                <div class="form-text">Gerado automaticamente ao salvar.</div>
              </div>

              <div class="col-lg-4 col-md-6">
                <label class="form-label">Data</label>
                <input
                  type="date"
                  class="form-control"
                  name="data_entrada"
                  required
                />
              </div>

              <div class="col-lg-4 col-md-12">
                <label class="form-label">Tipo de Documento</label>
                <select class="form-select" name="id_tipo" required>
                  <option value="" selected disabled>
                    Selecione o tipo ...
                  </option>
                  <option value="1">Ofício</option>
                  <option value="2">Memorando</option>
                  <option value="3">Contrato</option>
                  <option value="4">Requerimento</option>
                  <option value="5">Notificação</option>
                </select>
              </div>

              <div class="col-lg-10">
                <label class="form-label">Remetente</label>
                <input
                  type="text"
                  class="form-control"
                  name="remetente"
                  placeholder="Nome da instituição ou órgão de origem"
                  required
                />
              </div>

              <div class="col-lg-2">
                <div class="upload-wrap">
                  <button type="button" class="btn btn-upload">
                    <i class="bi bi-cloud-upload me-1"></i> Upload Arquivo
                  </button>
                  <div class="upload-line" aria-hidden="true"></div>
                </div>
              </div>

              <div class="col-12">
                <label class="form-label">Descrição/Assunto</label>
                <textarea
                  class="form-control"
                  name="descricao"
                  rows="5"
                  placeholder="Resumo do conteúdo do documento registrado .."
                ></textarea>
              </div>

              <div class="col-12 bottom-actions">
                <button
                  type="reset"
                  class="btn btn-outline-secondary btn-clear"
                >
                  Limpar Campos
                </button>
                <button type="submit" class="btn btn-success btn-finish">
                  <i class="bi bi-check-lg me-1"></i> Finalizar Registro
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/index.js"></script>
  </body>
</html>
